<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Architecture de la suite SiLeMIO</title>
  <desc id="desc">StageFlow est une console facultative. StageDesk, StageMark, StageMon, Dante Config Editor et AutoCAD peuvent chacun utiliser leur projet natif ou ouvrir directement le même projet StageFlow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101923"/><stop offset="1" stop-color="#14212d"/></linearGradient>
    <linearGradient id="project" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2a38"/><stop offset="1" stop-color="#223445"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58a8d3"/></marker>
    <style>
      text{font-family:'Segoe UI',Arial,sans-serif;fill:#f4f8fa}
      .muted{fill:#a9bac6}.teal{fill:#62d4c9}.blue{fill:#79c3ea}.small{font-size:20px}.tiny{font-size:16px}
      .app{fill:#1b2a38;stroke:#354b60;stroke-width:2}.pill{fill:#14212d;stroke:#354b60;stroke-width:1}
      .link{fill:none;stroke:#58a8d3;stroke-width:3;marker-start:url(#arrow);marker-end:url(#arrow)}
      .dash{fill:none;stroke:#21b6a8;stroke-width:3;stroke-dasharray:10 9;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="445" r="340" fill="#21b6a8" opacity=".035"/>
  <text x="70" y="67" font-size="38" font-weight="600">Un seul show, plusieurs outils</text>
  <text x="70" y="101" class="muted small">Chaque logiciel reste autonome. Le projet StageFlow et sa console restent facultatifs.</text>

  <g filter="url(#shadow)">
    <rect x="500" y="125" width="600" height="130" rx="18" fill="#172532" stroke="#21b6a8" stroke-width="3"/>
    <rect x="530" y="151" width="58" height="58" rx="14" fill="#213746" stroke="#21b6a8" stroke-width="2"/>
    <path d="M547 181h24M559 169v24M542 201c16-8 30-8 46 0" fill="none" stroke="#62d4c9" stroke-width="3" stroke-linecap="round"/>
    <text x="614" y="166" class="teal tiny" font-weight="600">APPLICATION GRATUITE · FACULTATIVE</text>
    <text x="614" y="203" font-size="30" font-weight="600">StageFlow</text>
    <text x="614" y="231" class="muted small">Patch · plan · console centrale · LIVE à la demande</text>
  </g>
  <path d="M800 255V305" class="dash"/>
  <text x="820" y="289" class="teal tiny">ouvre · détecte · coordonne</text>

  <g>
    <path d="M400 382H455" class="link"/>
    <path d="M400 552H455" class="link"/>
    <path d="M1145 382H1200" class="link"/>
    <path d="M1145 552H1200" class="link"/>
    <path d="M800 625V675" class="link"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="305" width="690" height="320" rx="24" fill="url(#project)" stroke="#58a8d3" stroke-width="3"/>
    <text x="800" y="352" text-anchor="middle" class="blue tiny" font-weight="600">FORMAT STAGEFLOW OUVERT PAR CHAQUE APPLICATION</text>
    <text x="800" y="401" text-anchor="middle" font-size="38" font-weight="600">Projet NomDuShow.stageflow</text>
    <text x="800" y="433" text-anchor="middle" class="muted small">Un dossier local · hors ligne · domaines séparés · sauvegardes protégées</text>
    <g transform="translate(500 462)">
      <rect width="185" height="52" rx="10" class="pill"/><text x="92" y="33" text-anchor="middle" class="small">Patch</text>
      <rect x="200" width="185" height="52" rx="10" class="pill"/><text x="292" y="33" text-anchor="middle" class="small">Plan / CAD</text>
      <rect x="400" width="185" height="52" rx="10" class="pill"/><text x="492" y="33" text-anchor="middle" class="small">StageDesk</text>
      <rect y="64" width="185" height="52" rx="10" class="pill"/><text x="92" y="97" text-anchor="middle" class="small">Dante</text>
      <rect x="200" y="64" width="185" height="52" rx="10" class="pill"/><text x="292" y="97" text-anchor="middle" class="small">StageMark</text>
      <rect x="400" y="64" width="185" height="52" rx="10" class="pill"/><text x="492" y="97" text-anchor="middle" class="small">StageMon</text>
    </g>
    <text x="800" y="606" text-anchor="middle" class="teal tiny">Chaque logiciel écrit sa partie et préserve les autres.</text>
  </g>

  <g transform="translate(70 320)">
    <rect width="330" height="125" rx="16" class="app"/>
    <text x="24" y="39" font-size="25" font-weight="600">StageDesk</text>
    <text x="24" y="70" class="muted tiny">Transfert consoles / logiciels audio</text>
    <rect x="24" y="87" width="118" height="26" rx="13" class="pill"/><text x="83" y="106" text-anchor="middle" class="tiny">Projet natif</text>
    <rect x="151" y="87" width="151" height="26" rx="13" fill="#173934"/><text x="227" y="106" text-anchor="middle" class="teal tiny">ou .stageflow</text>
  </g>
  <g transform="translate(70 490)">
    <rect width="330" height="125" rx="16" class="app"/>
    <text x="24" y="39" font-size="25" font-weight="600">Dante Config Editor</text>
    <text x="24" y="70" class="muted tiny">Préparation Dante hors ligne</text>
    <rect x="24" y="87" width="118" height="26" rx="13" class="pill"/><text x="83" y="106" text-anchor="middle" class="tiny">Projet natif</text>
    <rect x="151" y="87" width="151" height="26" rx="13" fill="#173934"/><text x="227" y="106" text-anchor="middle" class="teal tiny">ou .stageflow</text>
  </g>
  <g transform="translate(1200 320)">
    <rect width="330" height="125" rx="16" class="app"/>
    <text x="24" y="39" font-size="25" font-weight="600">StageMark</text>
    <text x="24" y="70" class="muted tiny">Implantation · cues · projection</text>
    <rect x="24" y="87" width="118" height="26" rx="13" class="pill"/><text x="83" y="106" text-anchor="middle" class="tiny">Projet natif</text>
    <rect x="151" y="87" width="151" height="26" rx="13" fill="#173934"/><text x="227" y="106" text-anchor="middle" class="teal tiny">ou .stageflow</text>
  </g>
  <g transform="translate(1200 490)">
    <rect width="330" height="125" rx="16" class="app"/>
    <text x="24" y="39" font-size="25" font-weight="600">StageMon</text>
    <text x="24" y="70" class="muted tiny">Écoutes A/B · 2 à 6 circuits configurés</text>
    <rect x="24" y="87" width="118" height="26" rx="13" class="pill"/><text x="83" y="106" text-anchor="middle" class="tiny">Projet natif</text>
    <rect x="151" y="87" width="151" height="26" rx="13" fill="#173934"/><text x="227" y="106" text-anchor="middle" class="teal tiny">ou .stageflow</text>
  </g>
  <g transform="translate(635 675)">
    <rect width="330" height="94" rx="16" class="app"/>
    <text x="24" y="38" font-size="25" font-weight="600">AutoCAD + connecteur</text>
    <text x="24" y="67" class="muted tiny">Plan technique · DWG · domaine CAD</text>
  </g>

  <g transform="translate(70 815)">
    <circle cx="10" cy="-7" r="7" fill="#21b6a8"/><text x="30" class="small">Installez seulement les outils utiles.</text>
    <circle cx="535" cy="-7" r="7" fill="#58a8d3"/><text x="555" class="small">LIVE peut être activé ou coupé.</text>
    <circle cx="1030" cy="-7" r="7" fill="#d89a2b"/><text x="1050" class="small">Les sécurités locales restent prioritaires.</text>
  </g>
  <text x="1530" y="868" text-anchor="end" class="muted tiny">SiLeMIO / By Mamat----[]---</text>
</svg>
